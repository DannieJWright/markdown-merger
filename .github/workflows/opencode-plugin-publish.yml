name: Publish opencode-plugin to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Extract version without v prefix
        id: version
        run: echo "VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_OUTPUT
      - name: Wait for md-merger to be published
        run: |
          for i in $(seq 1 10); do
            if npm view md-merger@$MD_MERGER_VERSION version >/dev/null 2>&1; then
              echo "md-merger@$MD_MERGER_VERSION is available"
              exit 0
            fi
            echo "Waiting for md-merger to publish... attempt $i/10"
            sleep 30
          done
          echo "ERROR: md-merger failed to publish within 5 minutes"
          exit 1
        env:
          MD_MERGER_VERSION: ${{ steps.version.outputs.VERSION }}
      - name: Replace link: with semver for npm publish
        working-directory: opencode-plugin
        run: |
          node -e "const p = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
          const root = JSON.parse(require('fs').readFileSync('../package.json', 'utf8'));
          p.dependencies['md-merger'] = '^' + root.version;
          require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');"
      - run: npm publish --provenance --access public
        working-directory: opencode-plugin
